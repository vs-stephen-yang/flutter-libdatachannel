name: flutter_libdatachannel
description: Flutter plugin for WebRTC media track sending/receiving using libdatachannel. Exposes flutter_webrtc-style API.
version: 0.0.1
homepage:

environment:
  sdk: ^3.6.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_libdatachannel
        pluginClass: FlutterLibdatachannelPlugin
      ios:
        pluginClass: FlutterLibdatachannelPlugin
      macos:
        pluginClass: FlutterLibdatachannelPlugin
      windows:
        pluginClass: FlutterLibdatachannelPluginCApi
